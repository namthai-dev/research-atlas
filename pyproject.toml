[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-atlas"
version = "0.1.0"
description = "A local-first research source catalog"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.120",
  "httpx>=0.27",
  "jinja2>=3.1",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
